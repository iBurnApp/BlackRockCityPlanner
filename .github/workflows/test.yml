name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    # The tests and geocoders read layouts, GIS and API data from the parent
    # iBurn-Data repo (`../../data/<year>/...`), so check this repo out at the
    # path it has as a submodule there: iBurn-Data/scripts/BlackRockCityPlanner.
    defaults:
      run:
        working-directory: iBurn-Data/scripts/BlackRockCityPlanner

    steps:
    - name: Check out iBurn-Data (test fixtures only)
      uses: actions/checkout@v7
      with:
        repository: iBurnApp/iBurn-Data
        path: iBurn-Data
        filter: blob:none
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /data/*/layouts/
          /data/*/geocoder/
          /data/*/geo/
          /data/*/APIData/
          !/data/*/APIData/**/MediaFiles/

    # OrgGeocoderTest reads Burning Man's GIS drop, which iBurn-Data carries as
    # a submodule. Check it out at the commit iBurn-Data pins.
    - name: Find the pinned innovate-GIS-data commit
      id: gis
      working-directory: iBurn-Data
      run: echo "sha=$(git rev-parse HEAD:bmorg/innovate-GIS-data)" >> "$GITHUB_OUTPUT"

    - name: Check out innovate-GIS-data (GeoJSON only)
      uses: actions/checkout@v7
      with:
        repository: burningmantech/innovate-GIS-data
        ref: ${{ steps.gis.outputs.sha }}
        path: iBurn-Data/bmorg/innovate-GIS-data
        filter: blob:none
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /*/GeoJSON/

    - name: Check out BlackRockCityPlanner
      uses: actions/checkout@v7
      with:
        path: iBurn-Data/scripts/BlackRockCityPlanner

    - name: Use Node.js from .nvmrc
      uses: actions/setup-node@v7
      with:
        node-version-file: iBurn-Data/scripts/BlackRockCityPlanner/.nvmrc
        cache: npm
        cache-dependency-path: iBurn-Data/scripts/BlackRockCityPlanner/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test
